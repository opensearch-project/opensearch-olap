/*
 * SPDX-License-Identifier: Apache-2.0
 *
 * OpenSearch OLAP Plugin - Vectorized analytics via Apache Velox
 */

buildscript {
    ext {
        opensearch_version = System.getProperty("opensearch.version", "${opensearch_version}")
        isSnapshot = "true" == System.getProperty("build.snapshot", "true")
    }

    repositories {
        mavenLocal()
        mavenCentral()
        maven { url "https://ci.opensearch.org/ci/dbc/snapshots/maven/" }
    }

    dependencies {
        classpath "org.opensearch.gradle:build-tools:${opensearch_version}"
    }
}

plugins {
    id 'com.diffplug.spotless' version '8.1.0'
}

import java.util.stream.Collectors

apply plugin: 'java'
apply plugin: 'opensearch.opensearchplugin'
apply plugin: 'opensearch.pluginzip'

group = 'org.opensearch.plugin'
version = opensearch_version
description = 'OpenSearch OLAP Plugin with Apache Velox integration for vectorized analytical query execution'

opensearchplugin {
    name 'opensearch-olap'
    description 'OpenSearch OLAP Plugin with Apache Velox integration for vectorized analytical query execution'
    classname 'org.opensearch.plugin.olap.OlapPlugin'
    // Extend the SQL plugin so our classloader can access its classes (ExecutionEngine, etc.)
    extendedPlugins = ['opensearch-sql']
    licenseFile rootProject.file("LICENSE.txt")
    noticeFile rootProject.file("NOTICE.txt")
}

repositories {
    mavenLocal()
    mavenCentral()
    maven { url "https://ci.opensearch.org/ci/dbc/snapshots/maven/" }
    maven { url "https://central.sonatype.com/repository/maven-snapshots/" }
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

spotless {
    java {
        target fileTree('.') {
            include '**/*.java'
            exclude '**/build/**', '**/build-*/**', '**/gen/**'
        }
        importOrder()
        licenseHeader("/*\n" +
                " * SPDX-License-Identifier: Apache-2.0\n" +
                " */\n\n")
        removeUnusedImports()
        trimTrailingWhitespace()
        endWithNewline()
        googleJavaFormat('1.32.0').reflowLongStrings().groupArtifact('com.google.googlejavaformat:google-java-format')
    }
}

configurations.all {
    // jsr305 (javax.annotation) is provided by the SQL plugin; exclude to avoid jar hell
    exclude group: 'com.google.code.findbugs', module: 'jsr305'
    // Override OpenSearch's failOnVersionConflict() - prefer highest version
    resolutionStrategy {
        preferProjectModules()
        // Force specific versions to resolve conflicts between OpenSearch/Calcite
        force 'com.google.guava:guava:33.4.8-jre'
        force 'org.apache.commons:commons-lang3:3.18.0'
        force 'org.apache.commons:commons-text:1.11.0'
        force 'org.locationtech.jts:jts-core:1.19.0'
        force 'joda-time:joda-time:2.12.7'
        force 'net.minidev:json-smart:2.5.2'
        force 'commons-codec:commons-codec:1.18.0'
        force 'commons-logging:commons-logging:1.3.5'
        force 'org.yaml:snakeyaml:2.3'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.9.10'
        force 'org.apache.httpcomponents.client5:httpclient5:5.6'
        force 'org.apache.httpcomponents.core5:httpcore5:5.4'
    }
}

// Repackage velox4j to strip classes that conflict with the SQL plugin's jsr305 jar.
// The velox4j fat jar bundles javax.annotation and org.slf4j which cause jar hell.
configurations {
    velox4jOriginal {
        transitive = false
    }
    // Exclude original velox4j from test configs to avoid jar hell with repackaged version
    testRuntimeClasspath {
        exclude group: 'org.boostscale', module: 'velox4j'
    }
    testCompileClasspath {
        exclude group: 'org.boostscale', module: 'velox4j'
    }
}

// velox4j bundles slf4j classes; exclude from plugin classpath to avoid jar hell at runtime.
// NOT excluded from integTest — the REST test client needs slf4j.
['compileClasspath', 'runtimeClasspath', 'testCompileClasspath', 'testRuntimeClasspath'].each { name ->
    configurations.named(name).configure {
        exclude group: 'org.slf4j', module: 'slf4j-api'
    }
}

tasks.register('repackageVelox4j', Jar) {
    archiveBaseName = 'velox4j-repackaged'
    from(zipTree(configurations.velox4jOriginal.singleFile)) {
        exclude 'javax/annotation/**'
        exclude 'org/slf4j/**'
    }
}

dependencies {
    velox4jOriginal "org.boostscale:velox4j:${velox4j_version}"

    // OpenSearch core (provided at runtime by OpenSearch)
    compileOnly "org.opensearch:opensearch:${opensearch_version}"

    // SQL plugin classes (provided at runtime via extendedPlugins classloader delegation).
    // These provide: ExecutionEngineExtension, ExecutionEngine.QueryResponse,
    // ExprValue, ExprCoreType, ResponseListener, CalcitePlanContext, Cursor
    // Published via: cd ../search-plugins-sql && ./gradlew :core:publishToMavenLocal :common:publishToMavenLocal
    // Exclude transitive deps - they're provided at runtime by OpenSearch/SQL plugin
    compileOnly("org.opensearch.query:unified-query-core:${sql_plugin_version}") { transitive = false }
    compileOnly("org.opensearch.query:unified-query-common:${sql_plugin_version}") { transitive = false }
    compileOnly("org.opensearch.query:unified-query-opensearch:${sql_plugin_version}") { transitive = false }

    // Apache Calcite for plan conversion (provided at runtime by the SQL plugin)
    compileOnly "org.apache.calcite:calcite-core:${calcite_version}"

    // Apache Arrow for columnar in-memory data
    implementation "org.apache.arrow:arrow-vector:${arrow_version}"
    implementation "org.apache.arrow:arrow-memory-core:${arrow_version}"
    implementation "org.apache.arrow:arrow-c-data:${arrow_version}"
    implementation "org.apache.arrow:arrow-format:${arrow_version}"
    implementation "com.google.flatbuffers:flatbuffers-java:24.3.25"
    // Use arrow-memory-unsafe instead of arrow-memory-netty. OpenSearch loads Netty in the
    // system classloader, but plugin classloaders are isolated and cannot see those classes.
    // arrow-memory-netty triggers a fatal NoClassDefFoundError (PooledByteBufAllocatorL) at
    // runtime. arrow-memory-unsafe uses sun.misc.Unsafe directly with no external dependencies.
    runtimeOnly "org.apache.arrow:arrow-memory-unsafe:${arrow_version}"

    // velox4j for Velox execution engine JNI bridge (repackaged to remove javax.annotation/slf4j)
    compileOnly "org.boostscale:velox4j:${velox4j_version}"
    runtimeOnly files(tasks.named('repackageVelox4j').map { it.archiveFile })

    // Test dependencies
    testImplementation "org.opensearch.test:framework:${opensearch_version}"
    testImplementation "org.opensearch:opensearch-agent-bootstrap:${opensearch_version}"
    testImplementation "org.opensearch:opensearch-agent:${opensearch_version}"
    testImplementation "junit:junit:4.13.2"
    testImplementation "org.mockito:mockito-core:5.20.0"
}

// =============================================================================
// Integration Test Framework
// =============================================================================

sourceSets {
    integTest {
        java.srcDir 'src/integTest/java'
        resources.srcDir 'src/integTest/resources'
        compileClasspath += sourceSets.main.output
        runtimeClasspath += output + compileClasspath
    }
}

configurations {
    // Plugin ZIP archives needed for the test cluster
    integTestPluginArchive
}

configurations.integTestRuntimeClasspath {
    exclude group: 'org.hamcrest', module: 'hamcrest-core'
}
configurations.integTestCompileClasspath {
    exclude group: 'org.hamcrest', module: 'hamcrest-core'
}

dependencies {
    integTestImplementation "org.opensearch.test:framework:${opensearch_version}"
    integTestImplementation "junit:junit:4.13.2"
    integTestImplementation "org.json:json:20250107"
    // slf4j is excluded from plugin classpath (for velox4j repackaging) but needed by the REST
    // test client (Apache HttpClient 5 → TLS). Must use matching versions — framework pulls 2.0.x.
    integTestImplementation "org.slf4j:slf4j-api:2.0.17"
    integTestRuntimeOnly "org.slf4j:slf4j-simple:2.0.17"

    // SQL plugin + job-scheduler ZIP for the test cluster
    integTestPluginArchive "org.opensearch.plugin:opensearch-sql-plugin:${sql_plugin_version}@zip"
    integTestPluginArchive "org.opensearch.plugin:opensearch-job-scheduler:${sql_plugin_version}@zip"
}

def getSqlPluginProvider() {
    provider { (org.gradle.api.file.RegularFile) (() ->
        configurations.integTestPluginArchive.asFileTree.matching {
            include '**/opensearch-sql*'
        }.singleFile)
    }
}

def getJobSchedulerPluginProvider() {
    provider { (org.gradle.api.file.RegularFile) (() ->
        configurations.integTestPluginArchive.asFileTree.matching {
            include '**/opensearch-job-scheduler*'
        }.singleFile)
    }
}

import org.opensearch.gradle.testclusters.StandaloneRestIntegTestTask

testClusters {
    integTest {
        testDistribution = 'archive'
        plugin(getJobSchedulerPluginProvider())
        plugin(getSqlPluginProvider())
        plugin(project.tasks.bundlePlugin.archiveFile)
        jvmArgs '-Xms1g', '-Xmx1g'
    }
}

tasks.register('integTest', StandaloneRestIntegTestTask) {
    description = 'Run integration tests against a cluster with SQL + OLAP plugins'
    group = 'verification'

    testClassesDirs = sourceSets.integTest.output.classesDirs
    classpath = sourceSets.integTest.runtimeClasspath

    useCluster testClusters.integTest

    nonInputProperties.systemProperty('tests.rest.cluster', "${-> testClusters.integTest.allHttpSocketURI.join(",")}")
    nonInputProperties.systemProperty('tests.clustername', "${-> testClusters.integTest.getName()}")
    systemProperty 'tests.security.manager', 'false'

    testLogging {
        events "passed", "failed", "skipped"
        showStandardStreams = true
    }

    dependsOn 'bundlePlugin'
}

publishing {
    publications {
        nebula(MavenPublication) {
            pom {
                name = 'OpenSearch OLAP Plugin'
                description = 'OpenSearch OLAP Plugin with Apache Velox integration for vectorized analytical query execution'
                licenses {
                    license {
                        name = 'The Apache License, Version 2.0'
                        url = 'http://www.apache.org/licenses/LICENSE-2.0.txt'
                    }
                }
                developers {
                    developer {
                        name = 'OpenSearch'
                        url = 'https://github.com/opensearch-project'
                    }
                }
            }
        }
    }
}

// Disable loggerUsageCheck — requires logger-usage artifact from full OpenSearch build
tasks.named('loggerUsageCheck').configure { enabled = false }

test {
    systemProperty 'io.netty.tryReflectionSetAccessible', 'true'
    jvmArgs += ["--add-opens", "java.base/java.nio=ALL-UNNAMED"]
    // Attach OpenSearch security agent required by test framework
    jvmArgs += ["-javaagent:${configurations.testRuntimeClasspath.files.find { it.name.startsWith('opensearch-agent-') && !it.name.contains('bootstrap') && !it.name.contains('policy') }}"]
}

// Third-party audit: only Arrow and velox4j are bundled; Calcite/Guava/Jackson are compileOnly
thirdPartyAudit.ignoreMissingClasses(
    // Jackson (Arrow optional dependency for JSON format)
    'com.fasterxml.jackson.databind.JsonNode',
    'com.fasterxml.jackson.databind.MapperFeature',
    'com.fasterxml.jackson.databind.MappingJsonFactory',
    'com.fasterxml.jackson.databind.ObjectMapper',
    'com.fasterxml.jackson.databind.ObjectReader',
    'com.fasterxml.jackson.databind.ObjectWriter',
    'com.fasterxml.jackson.databind.SerializerProvider',
    'com.fasterxml.jackson.databind.json.JsonMapper',
    'com.fasterxml.jackson.databind.json.JsonMapper$Builder',
    'com.fasterxml.jackson.databind.node.ObjectNode',
    'com.fasterxml.jackson.databind.ser.std.StdSerializer',
    // Netty (Arrow memory-netty internals)
    'io.netty.buffer.PooledByteBufAllocatorL',
    'io.netty.buffer.UnsafeDirectLittleEndian',
    'io.netty.util.internal.PlatformDependent',
    // Commons Codec (Arrow optional dependency)
    'org.apache.commons.codec.binary.Hex',
    // FlatBuffers (Arrow optional dependency for IPC)
    'com.google.flatbuffers.FlatBufferBuilder',
    // Arrow FlatBuf classes (optional, only when FlatBuffers is present)
    'org.apache.arrow.flatbuf.Binary',
    'org.apache.arrow.flatbuf.BinaryView',
    'org.apache.arrow.flatbuf.Block',
    'org.apache.arrow.flatbuf.BodyCompression',
    'org.apache.arrow.flatbuf.Bool',
    'org.apache.arrow.flatbuf.Buffer',
    'org.apache.arrow.flatbuf.Date',
    'org.apache.arrow.flatbuf.Decimal',
    'org.apache.arrow.flatbuf.DictionaryBatch',
    'org.apache.arrow.flatbuf.DictionaryEncoding',
    'org.apache.arrow.flatbuf.Duration',
    'org.apache.arrow.flatbuf.Field',
    'org.apache.arrow.flatbuf.FieldNode',
    'org.apache.arrow.flatbuf.FixedSizeBinary',
    'org.apache.arrow.flatbuf.FixedSizeList',
    'org.apache.arrow.flatbuf.FloatingPoint',
    'org.apache.arrow.flatbuf.Footer',
    'org.apache.arrow.flatbuf.Int',
    'org.apache.arrow.flatbuf.Interval',
    'org.apache.arrow.flatbuf.KeyValue',
    'org.apache.arrow.flatbuf.LargeBinary',
    'org.apache.arrow.flatbuf.LargeList',
    'org.apache.arrow.flatbuf.LargeListView',
    'org.apache.arrow.flatbuf.LargeUtf8',
    'org.apache.arrow.flatbuf.List',
    'org.apache.arrow.flatbuf.ListView',
    'org.apache.arrow.flatbuf.Map',
    'org.apache.arrow.flatbuf.Message',
    'org.apache.arrow.flatbuf.Null',
    'org.apache.arrow.flatbuf.RecordBatch',
    'org.apache.arrow.flatbuf.RunEndEncoded',
    'org.apache.arrow.flatbuf.Schema',
    'org.apache.arrow.flatbuf.Struct_',
    'org.apache.arrow.flatbuf.Time',
    'org.apache.arrow.flatbuf.Timestamp',
    'org.apache.arrow.flatbuf.Union',
    'org.apache.arrow.flatbuf.Utf8',
    'org.apache.arrow.flatbuf.Utf8View'
)

thirdPartyAudit.ignoreViolations(
    // Arrow off-heap memory uses sun.misc.Unsafe
    'org.apache.arrow.memory.util.MemoryUtil',
    'org.apache.arrow.memory.util.MemoryUtil$1'
)
